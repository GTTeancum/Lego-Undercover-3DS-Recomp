name: CTR Runtime CI
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/ctr_*"
      - "cmake/**"
      - "CMakeLists.txt"
      - "vendor/triaevum-a9b4477/recomp/**"
      - ".github/workflows/ctr-runtime-ci.yml"
  workflow_dispatch:
jobs:
  runtime-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v6
      - name: Configure ROM-free runtime tests
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
